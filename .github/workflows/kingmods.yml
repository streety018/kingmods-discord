name: KingMods Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run KingMods checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python kingmods.py

      - name: Save database
        run: |
          git config user.name "KingMods Bot"
          git config user.email "kingmods-bot@users.noreply.github.com"
          git add sent_mods.json
          git diff --cached --quiet || git commit -m "Update sent mods"
          git push
